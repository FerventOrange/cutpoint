version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # 24.04 is the release, not a version to bump: only refresh its digest.
    ignore:
      - dependency-name: ubuntu
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  # Actions are pinned by SHA with a "# vX.Y.Z" comment, which Dependabot keeps current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
