name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
      - run: uvx ruff@0.17.1 check src tests
      - run: uvx ruff@0.17.1 format --check src tests

  test:
    runs-on: ${{ matrix.os }}
    env:
      FFMPEG_LINUX_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-25-13-00/ffmpeg-n9.0.2-36-g6882969ce9-linux64-gpl-9.0.tar.xz
      FFMPEG_LINUX_SHA256: fdcc15b1ba538ee94c087c1ce9c1efe166cfe392beb362ccb778f595065365cc
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          python-version: "3.12"
      # The real-ffmpeg tests skip when ffmpeg/ffprobe are not on PATH, so install them.
      # Linux: pinned BtbN/FFmpeg-Builds static GPL build (n9.0.2; libx264, xfade, acrossfade,
      # loudnorm, zscale, tonemap), downloaded from a GitHub release and verified by SHA256, so CI
      # does not depend on Ubuntu apt mirrors (they failed on many PR runs). BtbN prunes old
      # autobuild tags, so the verified tarball is cached under the SHA256: a deleted tag only
      # breaks a cache miss, and then the bounded apt install below (Ubuntu 24.04 ships ffmpeg 6.1)
      # is the fallback. The cache is saved only after a successful static install, never after
      # an apt fallback, so a failed download cannot poison the key.
      # To bump: pick a newer autobuild tag and change FFMPEG_LINUX_URL and FFMPEG_LINUX_SHA256
      # both in this job's env and in the Dockerfile ARGs (the docker job checks they match; the
      # release API lists `digest: sha256:...` per asset).
      - name: Restore ffmpeg cache (Linux)
        id: ffmpeg-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-cache
          key: ffmpeg-linux-${{ env.FFMPEG_LINUX_SHA256 }}
      - name: Install ffmpeg (Linux)
        id: ffmpeg-linux
        if: runner.os == 'Linux'
        timeout-minutes: 25
        run: |
          install_static() {
            local dir="$RUNNER_TEMP/ffmpeg-cache" tarball
            tarball="$dir/ffmpeg.tar.xz"
            mkdir -p "$dir" || return 1
            if ! echo "$FFMPEG_LINUX_SHA256  $tarball" | sha256sum -c --status 2>/dev/null; then
              rm -f "$tarball"
              curl -fsSL --retry 3 --retry-delay 5 --retry-max-time 420 --connect-timeout 30 --max-time 300 \
                -o "$tarball" "$FFMPEG_LINUX_URL" || { rm -f "$tarball"; return 1; }
              echo "$FFMPEG_LINUX_SHA256  $tarball" | sha256sum -c --status || { echo "ffmpeg checksum mismatch" >&2; rm -f "$tarball"; return 1; }
            fi
            rm -rf "$RUNNER_TEMP/ffmpeg"
            mkdir -p "$RUNNER_TEMP/ffmpeg"
            tar -xJf "$tarball" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1 || return 1
            test -x "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" && test -x "$RUNNER_TEMP/ffmpeg/bin/ffprobe" || return 1
            "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" -version >/dev/null || return 1
            "$RUNNER_TEMP/ffmpeg/bin/ffprobe" -version >/dev/null || return 1
            echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" -version | head -1
          }
          if install_static; then
            echo "static=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf "$RUNNER_TEMP/ffmpeg-cache"
          echo "::warning::Static ffmpeg download failed; falling back to apt"
          # apt hung on the runner twice (no output, no timeout): bound every call and retry.
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            if sudo timeout 90 apt-get $apt_opts update \
              && sudo timeout 120 apt-get $apt_opts install -y --no-install-recommends ffmpeg; then
              ffmpeg -version | head -1
              exit 0
            fi
            echo "apt attempt $attempt failed" >&2
            sudo timeout 60 dpkg --configure -a || true
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "::error::Installing ffmpeg failed after 3 attempts"
          exit 1
      - name: Save ffmpeg cache (Linux)
        if: runner.os == 'Linux' && steps.ffmpeg-linux.outputs.static == 'true' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-cache
          key: ffmpeg-linux-${{ env.FFMPEG_LINUX_SHA256 }}
      # Windows has no ffmpeg: pinned gyan.dev 9.0.2 essentials build (the version the pano code was
      # measured on), downloaded from the GyanD/codexffmpeg release and verified by SHA256.
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FFMPEG_VERSION: "9.0.2"
          FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/ffmpeg-$env:FFMPEG_VERSION-essentials_build.zip" -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($hash -ne $env:FFMPEG_SHA256.ToUpper()) { throw "ffmpeg checksum mismatch: $hash" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "ffmpeg")
          $bin = Join-Path $env:RUNNER_TEMP "ffmpeg/ffmpeg-$env:FFMPEG_VERSION-essentials_build/bin"
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: Show ffmpeg
        run: |
          ffmpeg -version
          ffprobe -version
      # The tests are CPU-only; the dev group plus ocr-test (rapidocr + onnxruntime, for the discovery
      # e2e test) are synced (no gpu/events extras, no torch). `--no-group full` skips the default
      # `full` group (events + gpu, so torch); `uv run --no-sync` below does not sync anything.
      - run: uv sync --locked --no-group full --group ocr-test
      - run: uv run --no-sync pytest -q -rs

  # install.sh (Linux one-step installer) and install.ps1 (Windows one-step installer).
  installer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Lint install.sh
        if: runner.os == 'Linux'
        run: |
          shellcheck -s sh install.sh
          sh -n install.sh
      # Dry runs print every command and change nothing; assert the planned uv command lines.
      - name: Dry runs (Linux)
        if: runner.os == 'Linux'
        run: |
          expect() { printf '%s\n' "$1" | grep -Fq -- "$2" || { echo "::error::missing in dry run: $2"; printf '%s\n' "$1"; exit 1; }; }
          out=$(sh install.sh --dry-run --no-ffmpeg < /dev/null)
          expect "$out" 'uv tool install "cutpoint[events,ui,keyring,ski]=='
          expect "$out" '--torch-backend cpu'
          expect "$out" '--python 3.12 --reinstall'
          out=$(sh install.sh --dry-run --lite --no-ffmpeg < /dev/null)
          expect "$out" 'uv tool install "cutpoint[ui,keyring,ski]=='
          if printf '%s\n' "$out" | grep -q -- '--torch-backend'; then echo "::error::lite must not pick a torch backend"; exit 1; fi
          out=$(sh install.sh --dry-run --cuda --no-ffmpeg < /dev/null)
          expect "$out" 'uv tool install "cutpoint[all]=='
          expect "$out" '--torch-backend cu126'
          # A fake nvidia-smi on PATH selects the CUDA build.
          mkdir -p "$RUNNER_TEMP/fake-nvidia"
          printf '#!/bin/sh\necho "GPU 0: NVIDIA Test GPU (UUID: GPU-0)"\n' > "$RUNNER_TEMP/fake-nvidia/nvidia-smi"
          chmod +x "$RUNNER_TEMP/fake-nvidia/nvidia-smi"
          out=$(PATH="$RUNNER_TEMP/fake-nvidia:$PATH" sh install.sh --dry-run --no-ffmpeg < /dev/null)
          expect "$out" '--torch-backend cu126'
          # nvidia-smi's NVML error mentions "GPU" but lists none: stay on CPU torch.
          mkdir -p "$RUNNER_TEMP/fake-nvml"
          printf '#!/bin/sh\necho "Failed to initialize NVML: GPU access blocked by the operating system"\nexit 255\n' > "$RUNNER_TEMP/fake-nvml/nvidia-smi"
          chmod +x "$RUNNER_TEMP/fake-nvml/nvidia-smi"
          out=$(PATH="$RUNNER_TEMP/fake-nvml:$PATH" sh install.sh --dry-run --no-ffmpeg < /dev/null)
          expect "$out" '--torch-backend cpu'
          out=$(sh install.sh --dry-run --no-ffmpeg --source git@main < /dev/null)
          expect "$out" 'git+https://github.com/FerventOrange/cutpoint.git@main'
          expect "$out" '--no-sources'
          # update-shell is planned when the bin dir is not on the user's PATH, and not when it is.
          out=$(UV_TOOL_BIN_DIR="$RUNNER_TEMP/not-on-path" sh install.sh --dry-run --lite --no-ffmpeg < /dev/null)
          expect "$out" 'uv tool update-shell'
          mkdir -p "$RUNNER_TEMP/on-path"
          out=$(PATH="$RUNNER_TEMP/on-path:$PATH" UV_TOOL_BIN_DIR="$RUNNER_TEMP/on-path" sh install.sh --dry-run --lite --no-ffmpeg < /dev/null)
          if printf '%s\n' "$out" | grep -q 'update-shell'; then echo "::error::update-shell planned although the bin dir is on PATH"; exit 1; fi
          # XDG_DATA_HOME/../bin is normalized, so a PATH entry for the same directory counts.
          mkdir -p "$RUNNER_TEMP/xdg/share" "$RUNNER_TEMP/xdg/bin"
          out=$(PATH="$RUNNER_TEMP/xdg/bin:$PATH" XDG_DATA_HOME="$RUNNER_TEMP/xdg/share" UV_TOOL_BIN_DIR= XDG_BIN_HOME= sh install.sh --dry-run --lite --no-ffmpeg < /dev/null)
          if printf '%s\n' "$out" | grep -q 'update-shell'; then echo "::error::XDG_DATA_HOME/../bin not matched to PATH"; exit 1; fi
          # Contradictory or malformed flags exit 2; a missing source path fails even in a dry run.
          rc=0; sh install.sh --dry-run --cpu --cuda > /dev/null 2>&1 || rc=$?; [ "$rc" = 2 ] || { echo "::error::--cpu --cuda must exit 2, got $rc"; exit 1; }
          rc=0; sh install.sh --dry-run --lite --cuda > /dev/null 2>&1 || rc=$?; [ "$rc" = 2 ] || { echo "::error::--lite --cuda must exit 2, got $rc"; exit 1; }
          rc=0; sh install.sh --source --dry-run > /dev/null 2>&1 || rc=$?; [ "$rc" = 2 ] || { echo "::error::--source --dry-run must exit 2, got $rc"; exit 1; }
          rc=0; sh install.sh --dry-run --no-ffmpeg --source /does/not/exist > /dev/null 2>&1 || rc=$?; [ "$rc" = 1 ] || { echo "::error::missing --source path must exit 1, got $rc"; exit 1; }
          # Ollama: asked in full mode when missing (PATH without it); the remote script only runs
          # on a yes. Lite has no Ollama. Nothing is installed in a dry run.
          mkdir -p "$RUNNER_TEMP/no-ollama-bin"
          for t in sh cat uname sed awk grep id curl env dirname basename mktemp rm sleep uv; do p=$(command -v "$t") && ln -sf "$p" "$RUNNER_TEMP/no-ollama-bin/$t"; done
          out=$(PATH="$RUNNER_TEMP/no-ollama-bin" sh install.sh --dry-run --no-ffmpeg --ollama < /dev/null)
          expect "$out" 'curl -fsSL https://ollama.com/install.sh | sh'
          expect "$out" 'nohup ollama serve'
          out=$(PATH="$RUNNER_TEMP/no-ollama-bin" sh install.sh --dry-run --no-ffmpeg < /dev/null)
          expect "$out" 'Install Ollama (local AI models'
          if printf '%s\n' "$out" | grep -q 'ollama.com/install.sh | sh'; then echo "::error::Ollama script planned without a yes"; exit 1; fi
          out=$(PATH="$RUNNER_TEMP/no-ollama-bin" sh install.sh --dry-run --no-ffmpeg --no-ollama --yes < /dev/null)
          if printf '%s\n' "$out" | grep -qi 'install Ollama\|ollama.com/install.sh'; then echo "::error::--no-ollama must not ask or install"; exit 1; fi
          out=$(CUTPOINT_OLLAMA=1 PATH="$RUNNER_TEMP/no-ollama-bin" sh install.sh --dry-run --no-ffmpeg < /dev/null)
          expect "$out" 'curl -fsSL https://ollama.com/install.sh | sh'
          out=$(CUTPOINT_OLLAMA=0 PATH="$RUNNER_TEMP/no-ollama-bin" sh install.sh --dry-run --no-ffmpeg --ollama < /dev/null)
          expect "$out" 'curl -fsSL https://ollama.com/install.sh | sh'
          out=$(CUTPOINT_OLLAMA=1 PATH="$RUNNER_TEMP/no-ollama-bin" sh install.sh --dry-run --no-ffmpeg --no-ollama < /dev/null)
          if printf '%s\n' "$out" | grep -qi 'install Ollama\|ollama.com/install.sh'; then echo "::error::--no-ollama must beat CUTPOINT_OLLAMA=1"; exit 1; fi
          out=$(CUTPOINT_OLLAMA=0 PATH="$RUNNER_TEMP/no-ollama-bin" sh install.sh --dry-run --no-ffmpeg --yes < /dev/null)
          if printf '%s\n' "$out" | grep -qi 'install Ollama\|ollama.com/install.sh'; then echo "::error::CUTPOINT_OLLAMA=0 --yes must not install Ollama"; exit 1; fi
          # Lite: no prompt, no install, no pull; --ollama / CUTPOINT_OLLAMA=1 warns once and exits 0.
          out=$(PATH="$RUNNER_TEMP/no-ollama-bin" sh install.sh --dry-run --lite --no-ffmpeg --yes < /dev/null 2>&1)
          if printf '%s\n' "$out" | grep -qi 'ollama'; then echo "::error::lite must not mention or run Ollama without --ollama"; exit 1; fi
          for mode in flag env; do
            rc=0
            if [ "$mode" = flag ]; then
              out=$(PATH="$RUNNER_TEMP/no-ollama-bin" sh install.sh --dry-run --lite --no-ffmpeg --ollama --yes < /dev/null 2>&1) || rc=$?
            else
              out=$(CUTPOINT_OLLAMA=1 PATH="$RUNNER_TEMP/no-ollama-bin" sh install.sh --dry-run --lite --no-ffmpeg --yes < /dev/null 2>&1) || rc=$?
            fi
            [ "$rc" = 0 ] || { echo "::error::lite with Ollama ($mode) must exit 0, got $rc"; exit 1; }
            expect "$out" 'Ollama is not part of lite'
            [ "$(printf '%s\n' "$out" | grep -c 'Ollama is not part of lite')" = 1 ] || { echo "::error::lite Ollama warning must print once"; exit 1; }
            if printf '%s\n' "$out" | grep -q 'ollama.com/install.sh\|ollama pull\|ollama serve'; then echo "::error::lite must not install, start or pull Ollama"; exit 1; fi
          done
          # macOS path: fake uname (Darwin) and a no-op brew.
          mkdir -p "$RUNNER_TEMP/mac-bin"
          for t in sh cat sed awk grep id curl env dirname basename mktemp rm sleep uv; do p=$(command -v "$t") && ln -sf "$p" "$RUNNER_TEMP/mac-bin/$t"; done
          printf '#!/bin/sh\necho Darwin\n' > "$RUNNER_TEMP/mac-bin/uname"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/mac-bin/brew"
          chmod +x "$RUNNER_TEMP/mac-bin/uname" "$RUNNER_TEMP/mac-bin/brew"
          out=$(PATH="$RUNNER_TEMP/mac-bin" sh install.sh --dry-run --no-ffmpeg --ollama < /dev/null)
          expect "$out" '+ brew install ollama'
          expect "$out" '+ brew services start ollama'
          rc=0; sh install.sh --dry-run --ollama --no-ollama > /dev/null 2>&1 || rc=$?; [ "$rc" = 2 ] || { echo "::error::--ollama --no-ollama must exit 2, got $rc"; exit 1; }
          # curl | sh: the script is read from stdin.
          cat install.sh | sh -s -- --dry-run --lite --no-ffmpeg | grep -F 'uv tool install'
      # Package-manager ffmpeg commands on other distributions (dry run only, nothing installed).
      - name: Dry runs in Fedora and Arch containers (Linux)
        if: runner.os == 'Linux'
        run: |
          out=$(docker run --rm -v "$PWD/install.sh:/install.sh:ro" fedora:42 sh /install.sh --dry-run --lite)
          printf '%s\n' "$out" | grep -F 'dnf install -y ffmpeg'
          out=$(docker run --rm -v "$PWD/install.sh:/install.sh:ro" archlinux:base sh /install.sh --dry-run --lite)
          printf '%s\n' "$out" | grep -F 'pacman -S --needed --noconfirm ffmpeg'
      # Real lite install of this checkout into the runner (no torch, no models), stdin closed.
      - name: Install (lite, from this checkout)
        if: runner.os == 'Linux'
        run: |
          sh install.sh --lite --yes --no-ffmpeg --source . < /dev/null
          export PATH="$(uv tool dir --bin):$PATH"
          cutpoint --version | grep -F cutpoint
      - name: Lint install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Parse check under PowerShell 7 and Windows PowerShell 5.1.
          $check = '$e=$null;$t=$null;[void][System.Management.Automation.Language.Parser]::ParseFile("install.ps1",[ref]$t,[ref]$e);if($e.Count){$e|ForEach-Object{"$_"};exit 1}'
          pwsh -NoProfile -Command $check
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 does not parse in pwsh" }
          powershell -NoProfile -Command $check
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 does not parse in Windows PowerShell" }
          # PSScriptAnalyzer: errors fail the job, warnings are listed.
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $found = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error, Warning -ExcludeRule PSUseApprovedVerbs, PSAvoidUsingWriteHost, PSAvoidGlobalVars, PSUseShouldProcessForStateChangingFunctions, PSUseSingularNouns
          $found | Format-Table -AutoSize | Out-String -Width 200
          if (@($found | Where-Object Severity -eq 'Error').Count) { throw "PSScriptAnalyzer errors" }
      # Dry runs print every command and change nothing; assert the planned uv command lines under
      # both PowerShells.
      - name: Dry runs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Invoke-Installer([string]$Shell, [string[]]$Words, [hashtable]$EnvVars = @{}, [string]$Path = '') {
            $saved = @{}
            foreach ($k in $EnvVars.Keys) { $saved[$k] = [Environment]::GetEnvironmentVariable($k); [Environment]::SetEnvironmentVariable($k, $EnvVars[$k]) }
            $oldPath = $env:PATH
            # Hide an ollama.exe on PATH; the Ollama cases also need nothing listening on 127.0.0.1:11434.
            # winget.exe is hidden too: the cases that plan a winget install put a fake winget.cmd on PATH.
            $env:PATH = (($env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path -LiteralPath ([IO.Path]::Combine($_, 'ollama.exe'))) -and -not (Test-Path -LiteralPath ([IO.Path]::Combine($_, 'winget.exe'))) }) -join ';')
            if ($Path) { $env:PATH = "$Path;$env:PATH" }
            try {
              $out = (& $Shell -NoProfile -File install.ps1 @Words 2>&1 | ForEach-Object { "$_" }) -join "`n"
              return @{ Out = $out; Rc = $LASTEXITCODE }
            } finally {
              $env:PATH = $oldPath
              foreach ($k in $saved.Keys) { [Environment]::SetEnvironmentVariable($k, $saved[$k]) }
            }
          }
          function Expect($r, [string]$Text) {
            if (-not $r.Out.Contains($Text)) { Write-Host "::error::missing in dry run: $Text"; Write-Host $r.Out; throw "missing: $Text" }
          }
          function Refuse($r, [string]$Text) {
            if ($r.Out.Contains($Text)) { Write-Host "::error::unexpected in dry run: $Text"; Write-Host $r.Out; throw "unexpected: $Text" }
          }
          function Expect-Rc($r, [int]$Code, [string]$What) {
            if ($r.Rc -ne $Code) { Write-Host $r.Out; throw "$What must exit $Code, got $($r.Rc)" }
          }
          $tmp = $env:RUNNER_TEMP
          New-Item -ItemType Directory -Force "$tmp\fake-nvidia", "$tmp\fake-nvml", "$tmp\on-path" | Out-Null
          Set-Content "$tmp\fake-nvidia\nvidia-smi.cmd" "@echo GPU 0: NVIDIA Test GPU (UUID: GPU-0)" -Encoding ascii
          Set-Content "$tmp\fake-nvml\nvidia-smi.cmd" "@echo Failed to initialize NVML: GPU access blocked by the operating system`r`n@exit /b 255" -Encoding ascii
          foreach ($sh in 'pwsh', 'powershell') {
            Write-Host "=== $sh"
            $r = Invoke-Installer $sh @('-DryRun', '-NoFfmpeg', '-Cpu'); Expect-Rc $r 0 'dry run'
            Expect $r 'uv tool install "cutpoint[events,ui,keyring,ski]=='
            Expect $r '--torch-backend cpu'
            Expect $r '--python 3.12 --reinstall'
            $r = Invoke-Installer $sh @('-DryRun', '-Lite', '-NoFfmpeg')
            Expect $r 'uv tool install "cutpoint[ui,keyring,ski]=='
            Refuse $r '--torch-backend'
            $r = Invoke-Installer $sh @('-DryRun', '-Cuda', '-NoFfmpeg')
            Expect $r 'uv tool install "cutpoint[all]=='
            Expect $r '--torch-backend cu126'
            # A fake nvidia-smi on PATH selects the CUDA build; an NVML error stays on CPU torch.
            $r = Invoke-Installer $sh @('-DryRun', '-NoFfmpeg') -Path "$tmp\fake-nvidia"
            Expect $r '--torch-backend cu126'
            $r = Invoke-Installer $sh @('-DryRun', '-NoFfmpeg') -Path "$tmp\fake-nvml"
            Expect $r '--torch-backend cpu'
            $r = Invoke-Installer $sh @('-DryRun', '-NoFfmpeg', '-Lite', '-Source', 'git@main')
            Expect $r 'git+https://github.com/FerventOrange/cutpoint.git@main'
            Expect $r '--no-sources'
            # update-shell is planned when the bin dir is not on the user's PATH, and not when it is.
            $r = Invoke-Installer $sh @('-DryRun', '-Lite', '-NoFfmpeg') @{ UV_TOOL_BIN_DIR = "$tmp\not-on-path" }
            Expect $r 'uv tool update-shell'
            $r = Invoke-Installer $sh @('-DryRun', '-Lite', '-NoFfmpeg') @{ UV_TOOL_BIN_DIR = "$tmp\on-path" } "$tmp\on-path"
            Refuse $r 'update-shell'
            # Contradictory flags exit 2; a missing source path fails even in a dry run.
            $r = Invoke-Installer $sh @('-DryRun', '-Cpu', '-Cuda'); Expect-Rc $r 2 '-Cpu -Cuda'
            $r = Invoke-Installer $sh @('-DryRun', '-Lite', '-Cuda'); Expect-Rc $r 2 '-Lite -Cuda'
            $r = Invoke-Installer $sh @('-DryRun', '-NoFfmpeg', '-Source', 'C:\does\not\exist'); Expect-Rc $r 1 'missing -Source path'
            # The environment variables do what the flags do.
            $r = Invoke-Installer $sh @() @{ CUTPOINT_DRY_RUN = '1'; CUTPOINT_LITE = '1'; CUTPOINT_NO_FFMPEG = '1' }
            Expect $r 'uv tool install "cutpoint[ui,keyring,ski]=='
            # Ollama: asked in full mode when missing; the winget install only runs on a yes (prompt, -Ollama,
            # CUTPOINT_OLLAMA=1 or -Yes). Lite has no Ollama. Nothing is installed in a dry run.
            $noOl = @{ LOCALAPPDATA = "$tmp\no-localappdata" }
            $wingetOl = 'winget install --id Ollama.Ollama -e'
            New-Item -ItemType Directory -Force "$tmp\fake-winget" | Out-Null
            Set-Content "$tmp\fake-winget\winget.cmd" "@exit /b 0" -Encoding ascii
            $fw = "$tmp\fake-winget"
            $r = Invoke-Installer $sh @('-DryRun', '-NoFfmpeg', '-Ollama') $noOl $fw; Expect-Rc $r 0 '-Ollama'
            Expect $r $wingetOl
            Expect $r '+ ollama serve'
            Expect $r 'Pull qwen3.5:9b with Ollama (about 6.6 GB)?'
            # Without winget the dry run, like a real run, points to the download link.
            $r = Invoke-Installer $sh @('-DryRun', '-NoFfmpeg', '-Ollama') $noOl; Expect-Rc $r 0 '-Ollama without winget'
            Expect $r 'download Ollama from https://ollama.com/download'
            Refuse $r $wingetOl
            $r = Invoke-Installer $sh @('-DryRun', '-NoFfmpeg') $noOl
            Expect $r 'Install Ollama (local AI models for vision rating and the AI assistant)?'
            Refuse $r $wingetOl
            $r = Invoke-Installer $sh @('-DryRun', '-NoFfmpeg', '-Yes') $noOl $fw
            Expect $r $wingetOl
            $r = Invoke-Installer $sh @('-DryRun', '-NoFfmpeg', '-NoOllama', '-Yes') $noOl
            Refuse $r 'Install Ollama'
            Refuse $r $wingetOl
            $r = Invoke-Installer $sh @('-DryRun', '-NoFfmpeg') (@{ CUTPOINT_OLLAMA = '1' } + $noOl) $fw
            Expect $r $wingetOl
            $r = Invoke-Installer $sh @('-DryRun', '-NoFfmpeg', '-Ollama') (@{ CUTPOINT_OLLAMA = '0' } + $noOl) $fw
            Expect $r $wingetOl
            $r = Invoke-Installer $sh @('-DryRun', '-NoFfmpeg', '-NoOllama') (@{ CUTPOINT_OLLAMA = '1' } + $noOl)
            Refuse $r 'Install Ollama'
            Refuse $r $wingetOl
            $r = Invoke-Installer $sh @('-DryRun', '-NoFfmpeg', '-Yes') (@{ CUTPOINT_OLLAMA = '0' } + $noOl)
            Refuse $r 'Install Ollama'
            Refuse $r $wingetOl
            # Lite: no prompt, no install, no pull; -Ollama / CUTPOINT_OLLAMA=1 warns once and exits 0.
            $r = Invoke-Installer $sh @('-DryRun', '-Lite', '-NoFfmpeg', '-Yes') $noOl; Expect-Rc $r 0 'lite -Yes'
            Refuse $r 'Ollama'
            Refuse $r 'ollama'
            $lite = @(
              @{ Words = @('-DryRun', '-Lite', '-NoFfmpeg', '-Ollama', '-Yes'); Env = $noOl },
              @{ Words = @('-DryRun', '-Lite', '-NoFfmpeg', '-Yes'); Env = (@{ CUTPOINT_OLLAMA = '1' } + $noOl) }
            )
            foreach ($c in $lite) {
              $r = Invoke-Installer $sh $c.Words $c.Env; Expect-Rc $r 0 'lite with Ollama'
              Expect $r 'Ollama is not part of lite'
              if (([regex]::Matches($r.Out, 'Ollama is not part of lite')).Count -ne 1) { Write-Host $r.Out; throw 'lite Ollama warning must print once' }
              Refuse $r $wingetOl
              Refuse $r 'ollama pull'
              Refuse $r 'ollama serve'
            }
            $r = Invoke-Installer $sh @('-DryRun', '-Ollama', '-NoOllama'); Expect-Rc $r 2 '-Ollama -NoOllama'
            # irm | iex: the script text is evaluated with no parameters and no file.
            $saved = @{ D = $env:CUTPOINT_DRY_RUN; L = $env:CUTPOINT_LITE; F = $env:CUTPOINT_NO_FFMPEG }
            $env:CUTPOINT_DRY_RUN = '1'; $env:CUTPOINT_LITE = '1'; $env:CUTPOINT_NO_FFMPEG = '1'
            $out = (& $sh -NoProfile -Command 'Get-Content install.ps1 -Raw | iex' 2>&1 | ForEach-Object { "$_" }) -join "`n"
            $rc = $LASTEXITCODE
            $env:CUTPOINT_DRY_RUN = $saved.D; $env:CUTPOINT_LITE = $saved.L; $env:CUTPOINT_NO_FFMPEG = $saved.F
            Expect @{ Out = $out } 'uv tool install "cutpoint[ui,keyring,ski]=='
            if ($rc -ne 0) { Write-Host $out; throw "iex run must exit 0, got $rc" }
            # A failed install under irm | iex must exit nonzero too.
            $env:CUTPOINT_DRY_RUN = '1'; $env:CUTPOINT_LITE = '1'; $env:CUTPOINT_NO_FFMPEG = '1'; $env:CUTPOINT_SOURCE = 'C:\does\not\exist'
            $null = (& $sh -NoProfile -Command 'Get-Content install.ps1 -Raw | iex' 2>&1)
            $rc = $LASTEXITCODE
            $env:CUTPOINT_DRY_RUN = $saved.D; $env:CUTPOINT_LITE = $saved.L; $env:CUTPOINT_NO_FFMPEG = $saved.F; $env:CUTPOINT_SOURCE = $null
            if ($rc -eq 0) { throw "a failed iex run must exit nonzero" }
          }
          $global:LASTEXITCODE = 0  # the last case fails on purpose; the step's exit code must not inherit it
      # Real lite install of this checkout into the runner (no torch, no models), no prompts.
      - name: Install (lite, from this checkout) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1 -Lite -Yes -NoFfmpeg -Source .
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed" }
          $bin = (uv tool dir --bin)
          if (-not (& "$bin\cutpoint.exe" --version | Select-String -SimpleMatch -Quiet cutpoint)) { throw "cutpoint --version did not print cutpoint" }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Dockerfile pins the same ffmpeg as the test job above; fail if they drift apart.
      - name: Check ffmpeg pin matches the Dockerfile
        run: |
          for v in FFMPEG_LINUX_URL FFMPEG_LINUX_SHA256; do
            a=$(grep -m1 "^ *$v:" .github/workflows/ci.yml | sed 's/^[^:]*: *//')
            b=$(grep -m1 "^ARG $v=" Dockerfile | sed 's/^[^=]*=//')
            [ -n "$a" ] && [ "$a" = "$b" ] || { echo "::error::$v differs between ci.yml and Dockerfile"; exit 1; }
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: cutpoint:ci
          # Own scope and mode=min: this cache shares the repo's cache quota with the ffmpeg
          # cache of the test job, so keep it small (final-stage layers only) to avoid evicting it.
          cache-from: type=gha,scope=docker
          cache-to: type=gha,scope=docker,mode=min
      # The image's ENTRYPOINT is the cutpoint CLI.
      - run: docker run --rm cutpoint:ci --version
      # cv2 needs libGL/glib/xcb now that ffmpeg no longer comes from apt.
      - run: docker run --rm --entrypoint /app/.venv/bin/python cutpoint:ci -c "import cv2, scenedetect"
      # Burned-in captions need fontconfig and a font.
      - run: docker run --rm --entrypoint fc-match cutpoint:ci sans-serif | grep -F DejaVu
      # Fails when the Dockerfile fell back to apt ffmpeg (BtbN pruned the pinned tag): bump FFMPEG_LINUX_URL/SHA256 in both places.
      - run: docker run --rm --entrypoint ffmpeg cutpoint:ci -version | head -1 | grep -F "n9.0.2"
      - run: docker run --rm cutpoint:ci capabilities
      # Non-root with an arbitrary uid, as users run it with --user.
      - run: docker run --rm --user 4242:4242 cutpoint:ci paths
