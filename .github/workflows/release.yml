name: Release

on:
  release:
    types: [published]
  # Dry run: build and publish to TestPyPI only (never to PyPI).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Set a unique dev version for the TestPyPI dry run
        if: github.event_name == 'workflow_dispatch'
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # TestPyPI rejects re-uploads of an existing version, so suffix .devN.
          base="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml | head -n1)"
          if [ -z "$base" ]; then
            echo "::error::Could not read version from pyproject.toml"
            exit 1
          fi
          sed -i "s/^version = \".*\"$/version = \"${base}.dev${RUN_NUMBER}\"/" pyproject.toml
          echo "EXPECTED_VERSION=${base}.dev${RUN_NUMBER}" >> "$GITHUB_ENV"
      - run: uv build
      - name: Check the built version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="${EXPECTED_VERSION:-${TAG#v}}"
          shopt -s nullglob
          wheels=(dist/cutpoint-*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one wheel in dist/, found ${#wheels[@]}"
            exit 1
          fi
          built="${wheels[0]#dist/cutpoint-}"
          built="${built%%-*}"
          if [ "$built" != "$expected" ]; then
            echo "::error::Built version $built does not match release tag $TAG (expected $expected)"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cutpoint
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/cutpoint
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # Version-stamped installers and SHA256SUMS (#684). On a release they become release assets;
  # on workflow_dispatch this is a dry run: stamp and checksum, upload only as a workflow artifact.
  installers:
    needs: [build, publish]
    # publish is skipped on workflow_dispatch, so do not require it there.
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload (the release event only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stamp the installers and write SHA256SUMS
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          pyproject_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml | head -n1)"
          if [ -z "$pyproject_version" ]; then
            echo "::error::Could not read version from pyproject.toml"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            version="${TAG#v}"
            if [ "$version" != "$pyproject_version" ]; then
              echo "::error::Release tag $TAG does not match pyproject.toml version $pyproject_version"
              exit 1
            fi
          else
            version="$pyproject_version"
          fi
          python3 scripts/stamp_installers.py "$version" installers-out
          (cd installers-out && sha256sum -c SHA256SUMS)
      - name: Upload the files as a workflow artifact (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers
          path: installers-out/
          if-no-files-found: error
      # Adding assets after publishing fails if immutable releases are turned on for the repository.
      - name: Attach the files to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            installers-out/install.sh installers-out/install.ps1 installers-out/SHA256SUMS \
            --clobber --repo "$GITHUB_REPOSITORY"
