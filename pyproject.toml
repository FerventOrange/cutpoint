[project]
name = "cutpoint"
version = "0.1.0"
description = "Local, agent-driven AI video editor: finds highlights, cuts clips, builds montages, handles 360 video."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "faster-whisper>=1.2.1",
    "scenedetect>=0.7.2",
    "opencv-python>=5.0.0.93",
    "numpy>=2.5.4,<3",
    "OpenTimelineIO>=0.18.1",
    "requests>=2.34.2",
]

[project.optional-dependencies]
# Optional: action-cam telemetry (GoPro GPMF GPS/IMU) for --style ski and the
# optional 360-camera (Insta360) module.
ski = ["telemetry-parser>=0.3.0"]
# CUDA 12 runtime libs so faster-whisper / ctranslate2 transcribe on an NVIDIA GPU
# (cuBLAS + cuDNN 9, about 3.6 GB). Without them whisper runs on the CPU. Linux gets
# looser floors because the cu126 torch wheels (events extra) pin their own
# cuDNN/cuBLAS there.
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.27.0.42; sys_platform == 'win32'",
    "nvidia-cublas-cu12>=12.4; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9.1; sys_platform == 'linux'",
]
# `cutpoint events` layers (PANNs audio, HUD OCR, CLIP visual, Silero voice).
# Also needed by: `cutpoint fit` / `refmatch --taste` (scikit-learn taste head) and
# ski crash detection (`cutpoint crashes`, torch + open_clip for the visual check).
# torch/torchvision come from the PyTorch cu126 index on Windows/Linux (see [tool.uv]).
# Model weights and llama.cpp are downloaded separately: `cutpoint setup`.
events = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "panns-inference>=0.1.1",
    "torchlibrosa>=0.1.0",
    "rapidocr-onnxruntime>=1.4.4",
    "open_clip_torch>=3.3.0",
    "onnxruntime>=1.31.0",
    "scipy>=1.18.1",
    "scikit-learn>=1.9.1",
]
dev = ["pytest>=8", "ruff==0.17.1", "pre-commit>=3.7"]
all = ["cutpoint[ski,events,gpu]"]

[project.scripts]
cutpoint = "cutpoint.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cutpoint"]

# AGENTS.md stays at the repository root; ship a copy for `cutpoint guide`.
[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "cutpoint/AGENTS.md"

[tool.hatch.build.targets.sdist]
include = [
    "src/cutpoint",
    "AGENTS.md",
    "LICENSE",
    "README.md",
    "config.example.json",
    "pyproject.toml",
]

# CUDA 12.6 builds of torch / torchvision on Windows and Linux; PyPI elsewhere.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
# 99.9% of existing lines are <= 100 columns (only 18 of ~19.7k exceed it).
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "A",    # flake8-builtins (incl. A005 stdlib module shadowing)
    "RUF",  # ruff-specific
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PTH",  # flake8-use-pathlib
    "BLE",  # blind except: broad catches must be marked deliberate with noqa
    "PLC0415",  # import outside top level: heavy optional deps are imported lazily, marked with noqa
]
ignore = [
    "E501",          # long lines are handled by the formatter; stragglers are strings/comments
]

[tool.ruff.lint.isort]
known-first-party = ["cutpoint"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
