[project]
name = "cutpoint"
version = "0.2.0"
description = "Local, agent-driven AI video editor: finds highlights, cuts clips, builds montages, handles 360 video."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "faster-whisper>=1.2.1",
    "scenedetect>=0.7.2",
    "opencv-python>=5.0.0.93",
    "numpy>=2.5.4,<3",
    "OpenTimelineIO>=0.18.1",
    "requests>=2.34.2",
]

[project.optional-dependencies]
# Optional: action-cam telemetry (GoPro GPMF GPS/IMU) for --style ski and the
# optional 360-camera (Insta360) module.
ski = ["telemetry-parser>=0.4.0"]
# CUDA 12 runtime libs so faster-whisper / ctranslate2 transcribe on an NVIDIA GPU
# (cuBLAS + cuDNN 9, about 3.6 GB). Without them whisper runs on the CPU. Linux gets
# looser floors because the cu126 torch wheels (events extra) pin their own
# cuDNN/cuBLAS there.
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.27.0.42; sys_platform == 'win32'",
    "nvidia-cublas-cu12>=12.4; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9.1; sys_platform == 'linux'",
]
# `cutpoint events` layers (PANNs audio, HUD OCR, CLIP visual, Silero voice).
# Also needed by: `cutpoint fit` / `refmatch --taste` (scikit-learn taste head) and
# ski crash detection (`cutpoint crashes`, torch + open_clip for the visual check).
# torch/torchvision come from the PyTorch cu126 index on Windows/Linux (see [tool.uv]).
# Model weights and llama.cpp are downloaded separately: `cutpoint setup`.
events = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "panns-inference>=0.1.1",
    "torchlibrosa>=0.1.0",
    "rapidocr-onnxruntime>=1.4.4",
    "open_clip_torch>=3.3.0",
    "onnxruntime>=1.31.0",
    "scipy>=1.18.1",
    "scikit-learn>=1.9.1",
]
# `cutpoint ui`: local browser workspace for the standard-video highlight workflow.
ui = ["fastapi>=0.116", "uvicorn>=0.30"]
all = ["cutpoint[ski,events,gpu,ui]"]

[dependency-groups]
# Installed by default by `uv sync` / `uv run`; not part of the published wheel.
dev = ["pytest>=8", "ruff==0.17.1", "pre-commit>=3.7", "cutpoint[ui]", "httpx>=0.27"]
# Opt-in (`--group ocr-test`): CPU OCR for the slow discovery e2e test; CI syncs it, no torch.
ocr-test = ["rapidocr-onnxruntime>=1.4.4", "onnxruntime>=1.31.0"]

[project.scripts]
cutpoint = "cutpoint.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cutpoint"]

# AGENTS.md stays at the repository root; ship a copy for `cutpoint guide`.
[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "cutpoint/AGENTS.md"

[tool.hatch.build.targets.sdist]
include = [
    "src/cutpoint",
    "AGENTS.md",
    "LICENSE",
    "README.md",
    "config.example.json",
    "pyproject.toml",
]

# CUDA 12.6 builds of torch / torchvision on Windows and Linux; PyPI elsewhere.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
# OpenTimelineIO is pinned to 2f3e0a4, a commit of upstream main (0.19.0.dev1, 2026-07-12)
# because Cutpoint needs Python 3.14 and the latest PyPI release (0.18.1, 2025-11-09) has no
# cp314 wheel (upstream issue AcademySoftwareFoundation/OpenTimelineIO#1968); main's CI builds
# cp39-cp315 wheels. This is the newest main commit without a zlib build dependency (upstream
# #2021 added one right after), so Windows needs only MSVC. uv builds it from source: a C++
# compiler, and cmake (fetched from PyPI as a build requirement). The dependency above stays
# a plain PyPI requirement because PyPI rejects direct git dependencies and release.yml
# publishes to PyPI; only uv honours this source. Drop it once an OTIO release with cp314
# wheels is on PyPI.
opentimelineio = { git = "https://github.com/AcademySoftwareFoundation/OpenTimelineIO", rev = "2f3e0a433f22fc92b5341e71893c68b80b2ff935" }
# telemetry-parser (ski and all extras only) is pinned to a commit of upstream master
# (Python module 0.4.0, unreleased, 2026-10-27). Its wheel workflow has a cp314 row but runs
# only on v* tags, and the last tag is v0.3.0 (2024-01) with cp37-cp312 wheels and no sdist,
# so PyPI has nothing installable on Python 3.14. uv builds it from source with maturin:
# a Rust toolchain (rustup, stable). The same PyPI-requirement rule as above applies. Drop
# it once a release with cp314 wheels is on PyPI.
telemetry-parser = { git = "https://github.com/AdrianEddy/telemetry-parser", rev = "6701e6465a77e8dcac60c92e646587f729689658", subdirectory = "bin/python-module" }

# Build tools of the two git pins above, locked to the versions that built them, so a new
# cmake or maturin release cannot break a fresh build. Bump them together with the pins.
[tool.uv]
build-constraint-dependencies = ["cmake==4.4.4", "maturin==1.15.0"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only `hardware` is deselected by default; CI runs everything else (slow and ffmpeg included).
addopts = "-m \"not hardware\" --strict-markers"
markers = [
    "slow: real subprocess or interpreter spawns, process trees, or over about 2 s",
    "ffmpeg: runs the real ffmpeg or ffprobe",
    "hardware: needs real GPU hardware (for example a VAAPI device), which CI does not have",
]

[tool.ruff]
# Stays py313 until the separate format-only PR switches it to py314 and runs `ruff format`
# (py314 makes the formatter drop the parentheses of `except (A, B):`, PEP 758).
target-version = "py313"
src = ["src", "tests"]
# 99.9% of existing lines are <= 100 columns (only 18 of ~19.7k exceed it).
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "A",    # flake8-builtins (incl. A005 stdlib module shadowing)
    "RUF",  # ruff-specific
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PTH",  # flake8-use-pathlib
    "BLE",  # blind except: broad catches must be marked deliberate with noqa
    "PLC0415",  # import outside top level: heavy optional deps are imported lazily, marked with noqa
]
ignore = [
    "E501",          # long lines are handled by the formatter; stragglers are strings/comments
]

[tool.ruff.lint.isort]
known-first-party = ["cutpoint"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
